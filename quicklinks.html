
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Advising Quick Links</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Lato", Arial, sans-serif;
      margin: 40px;
      max-width: 1200px;
      line-height: 1.5;
      color: #222;
    }

    h1 {
      margin-bottom: 20px;
    }

    /* 4-column layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px;
    }

    /* Each column */
    .column {
      border-left: 2px solid #eee;
      padding-left: 15px;
    }

    .column h2 {
      font-size: 18px;
      margin-bottom: 10px;
    }

    a {
      display: block;
      margin: 8px 0;
      color: #1a73e8;
      text-decoration: none;
      font-size: 15px;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Responsive (important for WCAG + mobile) */
    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <h1>Advising Quick Links</h1>

  <div class="grid">

    <!-- Column 1 -->
    <div class="column">
      <h2>Mathematics</h2>
      <a href="ma.html">Math Progression</a>
      <a href="#">Calculus I/II Info</a>
      <a href="#">Linear Algebra</a>
    </div>

    <!-- Column 2 -->
    <div class="column">
      <h2>Physics</h2>
      <a href="phys.html">Physics Progression</a>
      <a href="#">Mechanics Sequence</a>
      <a href="#">E&M Sequence</a>
    </div>

    <!-- Column 3 -->
    <div class="column">
      <h2>Statistics</h2>
      <a href="#">STAT 350 Path</a>
      <a href="#">Data Science Track</a>
    </div>

    <!-- Column 4 -->
    <div class="column">
      <h2>Advising</h2>
      <a href="#">Degree Requirements</a>
      <a href="#">Scheduling Tips</a>
      <a href="#">Policies</a>
    </div>

  </div>

</body>
</html>
